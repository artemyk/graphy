[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "graphy"
version = "0.3.0"  # authoritative version
description = "Dynamical systems for Python"
authors = [{name = "Artemy Kolchinsky", email = "artemyk@gmail.com"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.6",
    "scipy>=0.13",
    "six>=1.8.0",
    "networkx"
]
license = "GPL-3.0-or-later"

[project.optional-dependencies]
test = [
    "coverage>=3.7.0",
    "sphinx>=1.0.0",
    "matplotlib"
]

[project.urls]
Homepage = "https://github.com/artemyk/graphy"
Documentation = "http://graphy.readthedocs.org/"

[tool.setuptools]
packages = ["graphy"]
include-package-data = true
zip-safe = true
